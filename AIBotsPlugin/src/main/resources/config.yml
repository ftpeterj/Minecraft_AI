# Native Ollama (primary). Leave model empty to use the first pulled model.
# Ollama must listen on the LAN (OLLAMA_HOST=0.0.0.0) if the MC server is another box.
ollama:
  base-url: "http://dadsbox.local:11434"
  model: "qwen2.5:14b"
  timeout-seconds: 120
  max-tokens: 400
  temperature: 0.7

# LM Studio kept as fallback if Ollama is down
lm-studio:
  base-url: "http://dadsbox.local:1234/v1"
  # Leave empty to use the first model reported by LM Studio
  model: "llama-3.2-8x3b-moe-dark-champion-instruct-uncensored-abliterated-18.4b"
  timeout-seconds: 60
  max-tokens: 400
  temperature: 0.7

# Multi-LLM router — primary Ollama, optional LM Studio fallback + cloud
llm:
  primary: ollama
  # If Ollama is unreachable, chat falls through to this provider
  fallback-to: lm-studio
  # When true, COMPLEX prompts (plans, design, long messages) use escalate-to
  escalate-complex: false
  escalate-to: openai
  providers:
    ollama:
      type: ollama
      base-url: "http://dadsbox.local:11434"
      model: "qwen2.5:14b"
      timeout-seconds: 120
      max-tokens: 400
      temperature: 0.7
    lm-studio:
      type: openai-compatible
      base-url: "http://dadsbox.local:1234/v1"
      model: "llama-3.2-8x3b-moe-dark-champion-instruct-uncensored-abliterated-18.4b"
      timeout-seconds: 60
      max-tokens: 400
      temperature: 0.7
    # Optional cloud (set api-key to enable). Leave blank to ignore.
    openai:
      type: openai-compatible
      base-url: "https://api.openai.com/v1"
      api-key: ""
      model: "gpt-4o-mini"
      timeout-seconds: 90
      max-tokens: 600
      temperature: 0.6
    grok:
      type: openai-compatible
      base-url: "https://api.x.ai/v1"
      api-key: ""
      model: "grok-2-latest"
      timeout-seconds: 90
      max-tokens: 600
      temperature: 0.7

# Item stack size (vanilla component hard-cap is 99)
items:
  apply-max-stack: true
  default-max-stack: 99

crew:
  max-bots-per-player: 6
  # Wipe bots.yml + world crew bodies on every plugin/server load (no ghosts after restart)
  clear-on-load: true
  # "pool" = distinct skin per bot from crew.skin-pool below (recommended — bots don't
  #          all look like clones of the owner)
  # "owner" = use summoner's Minecraft username skin for every bot
  default-skin: "pool"
  # Usernames drawn from when default-skin is "pool". Each new bot gets the first entry
  # not already worn by one of your active crew (wraps to random once exhausted).
  # Edit freely to your own favorite skins.
  skin-pool:
    - "Notch"
    - "jeb_"
    - "Dinnerbone"
    - "xisumavoid"
  # player / citizens = human player model + skin (needs Citizens)
  # villager = native villager body (fallback if skins fail)
  # armorstand = player head + leather body
  avatar-mode: player
  # Extra blocks upward for model footing
  y-offset: 0.0
  tick-interval: 20
  chat-mention-enabled: true
  show-title-on-nameplate: true
  # Personal loot bag size (multiple of 9, max 54 = double chest)
  loot-slots: 54
  # Pathfinder walk speed multiplier (keep near 1.0 — high values cause thrash)
  walk-speed: 1.05
  # Default work/search radius (blocks). Was effectively capped at 48 before 1.5.7.
  # Change with /crew radius default <n>  or session-only /crew radius <n>
  # Don't mine/harvest this close to home or registered chests
  storage-keepout: 8
  work-radius: 48
  survey-radius: 48
  far-resource-blocks: 28
  # Warn (require "confirm") when setting radius above this
  radius-warn-above: 200
  radius-hard-min: 8
  radius-hard-max: 512
  # Long-haul: lay rails + chest minecart when deposit is far (needs rails in storage/bag)
  rail-haul:
    enabled: true
    min-distance: 40
  # Announce inter-bot messages to the owner in chat
  inter-bot-announce: true
  # Shared job board (idle bots claim matching open jobs)
  job-board:
    max-jobs: 64
    claim-timeout-seconds: 300
  # Cosmetic idle behavior: wander/look-at-player/emote for idle bots with no order,
  # so they don't stand frozen. Never issues work; stays within wander-radius of home.
  # Titles with auto-when-idle: true already move on their own and are skipped here.
  idle-liveliness:
    enabled: true
    wander-radius: 5
    wander-interval-seconds: 60
    look-radius: 10
    look-interval-seconds: 10
    emote-interval-seconds: 120
    emote-chance: 0.4

learning:
  # If true, writes learning.yml on every observation (heavier I/O)
  save-on-observe: false

storage:
  expand-when-full: true
  max-chests: 32
  prefer-double-chest: true
  # Max blocks scanned by /crew storage register (like /fill volume)
  register-max-volume: 200000
  # If pos1/pos2 Y span is thinner than this, auto-expand height (room scan).
  # Playtested: set pos1 on floor corner and pos2 on opposite CEILING / top of chest wall
  # so the box is tall — flat same-floor corners miss wall chests.
  register-min-y-thickness: 3
  register-y-pad-below: 1
  register-y-pad-above: 8

titles:
  # Generalist — notices nearest of logs, stone/ores, sand/gravel, etc.
  scavenger:
    display: "Scavenger"
    color: "GOLD"
    personality: "You scavenge whatever useful resource is nearest. You fill chests and expand storage. You help teammates who need materials."
    gather-radius: 24
    # Items in bag before walking home to stash (0 = 64, like a player armful). -1 = wait until every slot is used.
    deposit-threshold: 64
    # Scavenge nearest useful blocks even without a spoken order (after home is set)
    auto-when-idle: true
    # Leave valued-materials empty to use built-in scavenger awareness (mixed).
    valued-materials: []
  # Pickaxe work — stone, deepslate, ores, netherrack, etc.
  miner:
    display: "Miner"
    color: "DARK_GRAY"
    personality: "You are a miner. You know pickaxe tiers and recipes (table, sticks, picks, furnace, anvil). You craft the right pick for the rock, smelt iron when needed, and prefer anvil repair over crafting brand-new tools when gear is damaged."
    gather-radius: 28
    deposit-threshold: 64
    auto-when-idle: false
    valued-materials: []
  # Forest work — trees, leaves, flowers, saplings, mushrooms, vines
  woodsman:
    display: "Woodsman"
    color: "DARK_GREEN"
    personality: "You are a woodsman. You harvest the nearest trees, leaves, flowers, and forest plants. You keep the storage stocked with wood and flora."
    gather-radius: 32
    deposit-threshold: 64
    auto-when-idle: false
    valued-materials: []
  hunter:
    display: "Hunter"
    color: "GOLD"
    personality: "You hunt wild animals for meat and drops. You avoid tamed pets and deposit food to storage."
    hunt-radius: 24
    attack-damage: 5.0
    auto-when-idle: false
  farmer:
    display: "Farmer"
    color: "GREEN"
    personality: "You harvest mature crops and replant seeds. You tend fields near home."
    farm-radius: 20
    auto-when-idle: false
  warrior:
    display: "Warrior"
    color: "RED"
    personality: "You fight hostiles on order and can patrol. You learn threats."
    engage-radius: 16
    attack-damage: 5.0
    guard-owner: true
    auto-when-idle: false
  protector:
    display: "Protector"
    color: "DARK_RED"
    personality: "You automatically guard the owner and home, patrol, and engage monsters."
    engage-radius: 18
    attack-damage: 4.0
    guard-owner: true
    auto-when-idle: true
  builder:
    display: "Builder"
    color: "AQUA"
    personality: "You construct buildings and structures. You build walls, platforms, pillars, and simple box huts from storage materials. When short on blocks you ask gatherers for help."
