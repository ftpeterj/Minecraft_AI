name: BotInterop
version: '1.0.0'
description: Right-click a bot account to open its live inventory; check its health/hunger on demand
main: com.botinterop.BotInteropPlugin
api-version: '1.21'
author: ftpeterj

commands:
  botstatus:
    description: Show a bot account's health, hunger, and location
    usage: /botstatus <name>
    permission: botinterop.status
  botinv:
    description: Open a bot account's main inventory from anywhere
    usage: /botinv <name>
    permission: botinterop.use
  botarmor:
    description: Open a bot account's armor + offhand slots from anywhere
    usage: /botarmor <name>
    permission: botinterop.use
  botrepair:
    description: Toggle auto-repair (durability resets every 5s) for a bot account
    usage: /botrepair <name> <on|off>
    permission: botinterop.use
  botfriend:
    description: Manage who's trusted to see/open a bot account's inventory (owner-only)
    usage: /botfriend <add|remove|list> [name]
  bottrade:
    description: Approve/deny a non-friend's trade proposal with a bot account (owner-only)
    usage: /bottrade <approve|deny|list> [name]
  whereis:
    description: Report any online player's real position (workaround for the bot's own unreliable client-side entity tracking)
    usage: /whereis <player>
    permission: botinterop.use
  whatsin:
    description: List any container block's contents by coordinates (chest, barrel, furnace, etc.)
    usage: /whatsin <x> <y> <z>
    permission: botinterop.use

permissions:
  botinterop.use:
    description: Right-click a bot account (or /botinv) to open its live inventory
    default: true
  botinterop.status:
    description: Check a bot account's health/hunger via /botstatus
    default: true
